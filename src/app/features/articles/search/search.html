<section class="mx-auto max-w-6xl px-4 pt-8" role="search">
  <div class="surface flex flex-col gap-5 p-5 md:p-6">
    <div>
      <label for="title" class="sr-only">Rechercher un article par titre</label>
      <div class="relative">
        <span
          class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"
          aria-hidden="true"
          >🔍</span
        >
        <input
          id="title"
          type="search"
          autocomplete="off"
          placeholder="Rechercher un article par titre…"
          class="w-full rounded-xl border border-white/10 bg-canvas py-3 pl-11 pr-4 text-gray-100 placeholder:text-gray-500 focus:border-xbox-bright focus:outline-none focus:ring-2 focus:ring-xbox-bright/40"
          [formField]="searchForm.title"
        />
      </div>
    </div>

    <fieldset class="flex flex-wrap items-center gap-2">
      <legend class="sr-only">Filtrer par catégorie</legend>
      <button uiChip [active]="selectedCategory() === ''" (click)="onSelectCategory('')">
        Toutes
      </button>
      @for (category of categories(); track category) {
        <button
          uiChip
          [active]="selectedCategory() === category"
          (click)="onSelectCategory(category)"
        >
          {{ category }}
        </button>
      }
    </fieldset>
  </div>
</section>
